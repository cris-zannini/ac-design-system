<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: #fff; font-family: var(--ac-font-body); display: flex; align-items: center; justify-content: center; gap: 28px; flex-wrap: wrap; }
  .slot { display: flex; flex-direction: column; align-items: center; gap: 8px; max-width: 180px; }
  .slot img { max-width: 100%; height: 80px; object-fit: contain; }
  .slot span { font-family: var(--ac-font-mono); font-size: 10px; color: var(--ac-fg-muted); text-align: center; }
</style>
</head>
<body>
  <div class="slot"><img src="../assets/logo-completa.png" alt=""><span>completa</span></div>
  <div class="slot"><img src="../assets/logo-simplificada-tagline.png" alt=""><span>simplificada · tagline</span></div>
  <div class="slot"><img src="../assets/logo-simplificada.png" alt=""><span>simplificada</span></div>
  <div class="slot"><img src="../assets/logo-vertical.png" alt=""><span>vertical</span></div>
</body>
</html>
