<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: #fff; font-family: var(--ac-font-body); }
  .row { display: flex; align-items: flex-end; gap: 4px; }
  .step { background: var(--ac-blue); border-radius: 6px; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 6px; flex: 1; }
  .label { font-family: var(--ac-font-mono); font-size: 10px; color: var(--ac-fg-muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="col"><div class="step" style="width:100%;height:4px;"></div><div class="label">1 · 4</div></div>
    <div class="col"><div class="step" style="width:100%;height:8px;"></div><div class="label">2 · 8</div></div>
    <div class="col"><div class="step" style="width:100%;height:12px;"></div><div class="label">3 · 12</div></div>
    <div class="col"><div class="step" style="width:100%;height:16px;"></div><div class="label">4 · 16</div></div>
    <div class="col"><div class="step" style="width:100%;height:24px;"></div><div class="label">5 · 24</div></div>
    <div class="col"><div class="step" style="width:100%;height:32px;"></div><div class="label">6 · 32</div></div>
    <div class="col"><div class="step" style="width:100%;height:48px;"></div><div class="label">7 · 48</div></div>
    <div class="col"><div class="step" style="width:100%;height:64px;"></div><div class="label">8 · 64</div></div>
    <div class="col"><div class="step" style="width:100%;height:96px;"></div><div class="label">9 · 96</div></div>
  </div>
</body>
</html>
