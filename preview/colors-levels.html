<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: #fff; font-family: var(--ac-font-body); color: var(--ac-fg); }
  .levels { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .lvl {
    aspect-ratio: 1 / 1;
    border-radius: 18px;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    background: var(--ac-level-c); color: var(--ac-level-on-c);
    box-shadow: 0 5px 0 var(--ac-level-dark-c);
    position: relative; overflow: hidden;
  }
  .lvl::before {
    content: ""; position: absolute; inset: -20%;
    background: rgba(255,255,255,0.14);
    border-radius: 60% 40% 55% 45% / 48% 60% 40% 52%;
    transform: rotate(-15deg);
  }
  .lvl b { font-family: var(--ac-font-display); font-weight: 900; font-size: 26px; position: relative; }
  .lvl span { font-size: 10px; font-weight: 900; letter-spacing: 0.14em; position: relative; }
  .pair { display: flex; gap: 4px; margin-top: 10px; }
  .pair div { flex: 1; height: 22px; border-radius: 6px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.06); }
  .cap { font-family: var(--ac-font-mono); font-size: 9.5px; color: var(--ac-fg-soft); margin-top: 4px; display: flex; justify-content: space-between; }
  .n1 { --ac-level-c: var(--ac-level-1); --ac-level-dark-c: var(--ac-level-1-dark); --ac-level-soft-c: var(--ac-level-1-soft); --ac-level-on-c: var(--ac-level-1-on); }
  .n2 { --ac-level-c: var(--ac-level-2); --ac-level-dark-c: var(--ac-level-2-dark); --ac-level-soft-c: var(--ac-level-2-soft); --ac-level-on-c: var(--ac-level-2-on); }
  .n3 { --ac-level-c: var(--ac-level-3); --ac-level-dark-c: var(--ac-level-3-dark); --ac-level-soft-c: var(--ac-level-3-soft); --ac-level-on-c: var(--ac-level-3-on); }
  .n4 { --ac-level-c: var(--ac-level-4); --ac-level-dark-c: var(--ac-level-4-dark); --ac-level-soft-c: var(--ac-level-4-soft); --ac-level-on-c: var(--ac-level-4-on); }
  .n5 { --ac-level-c: var(--ac-level-5); --ac-level-dark-c: var(--ac-level-5-dark); --ac-level-soft-c: var(--ac-level-5-soft); --ac-level-on-c: var(--ac-level-5-on); }
  .na { --ac-level-c: var(--ac-level-abc); --ac-level-dark-c: var(--ac-level-abc-dark); --ac-level-soft-c: var(--ac-level-abc-soft); --ac-level-on-c: var(--ac-level-abc-on); }
</style>
</head>
<body>
  <div class="levels">
    <div class="n1"><div class="lvl"><b>NV1</b><span>LILÁS</span></div><div class="pair"><div style="background:var(--ac-level-soft-c)"></div><div style="background:var(--ac-level-c)"></div><div style="background:var(--ac-level-dark-c)"></div></div><div class="cap"><span>soft</span><span>base</span><span>dark</span></div></div>
    <div class="n2"><div class="lvl"><b>NV2</b><span>VERDE-ÁGUA</span></div><div class="pair"><div style="background:var(--ac-level-soft-c)"></div><div style="background:var(--ac-level-c)"></div><div style="background:var(--ac-level-dark-c)"></div></div><div class="cap"><span>soft</span><span>base</span><span>dark</span></div></div>
    <div class="n3"><div class="lvl"><b>NV3</b><span>LARANJA</span></div><div class="pair"><div style="background:var(--ac-level-soft-c)"></div><div style="background:var(--ac-level-c)"></div><div style="background:var(--ac-level-dark-c)"></div></div><div class="cap"><span>soft</span><span>base</span><span>dark</span></div></div>
    <div class="n4"><div class="lvl"><b>NV4</b><span>MAGENTA</span></div><div class="pair"><div style="background:var(--ac-level-soft-c)"></div><div style="background:var(--ac-level-c)"></div><div style="background:var(--ac-level-dark-c)"></div></div><div class="cap"><span>soft</span><span>base</span><span>dark</span></div></div>
    <div class="n5"><div class="lvl"><b>NV5</b><span>VERDE SPLASH</span></div><div class="pair"><div style="background:var(--ac-level-soft-c)"></div><div style="background:var(--ac-level-c)"></div><div style="background:var(--ac-level-dark-c)"></div></div><div class="cap"><span>soft</span><span>base</span><span>dark</span></div></div>
    <div class="na"><div class="lvl"><b>ABC</b><span>AZUL</span></div><div class="pair"><div style="background:var(--ac-level-soft-c)"></div><div style="background:var(--ac-level-c)"></div><div style="background:var(--ac-level-dark-c)"></div></div><div class="cap"><span>soft</span><span>base</span><span>dark</span></div></div>
  </div>
</body>
</html>
