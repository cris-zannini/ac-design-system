<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Card</title>
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: #fff; font-family: var(--ac-font-body); color: var(--ac-fg); }
  .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
  .swatch {
    aspect-ratio: 1.4 / 1; border-radius: var(--ac-radius-lg);
    display: flex; flex-direction: column; justify-content: flex-end; padding: 12px;
    box-shadow: var(--ac-shadow-card);
    font-weight: var(--ac-weight-black);
    min-height: 96px;
  }
  .swatch .name { font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; }
  .swatch .hex  { font-family: var(--ac-font-mono); font-size: 11px; opacity: 0.85; margin-top: 2px; }
  .light { color: var(--ac-navy); } .dark { color: #fff; }
</style>
</head>
<body>
  <div class="row">
    <div class="swatch dark"  style="background:var(--ac-blue)"><div class="name">Azul Principal</div><div class="hex">#0082C2</div></div>
    <div class="swatch dark"  style="background:var(--ac-blue-light)"><div class="name">Azul Claro</div><div class="hex">#0096C7</div></div>
    <div class="swatch light" style="background:var(--ac-green-splash)"><div class="name">Verde Splash</div><div class="hex">#89BD24</div></div>
    <div class="swatch light" style="background:var(--ac-yellow);color:var(--ac-blue-900)"><div class="name">Amarelo Lúdico</div><div class="hex">#FFCA28</div></div>
    <div class="swatch dark"  style="background:var(--ac-magenta)"><div class="name">Magenta</div><div class="hex">#D1104A</div></div>
    <div class="swatch light" style="background:var(--ac-lilac)"><div class="name">Lilás</div><div class="hex">#BA8DC0</div></div>
    <div class="swatch light" style="background:var(--ac-teal)"><div class="name">Verde-Água</div><div class="hex">#46B9B0</div></div>
    <div class="swatch light" style="background:var(--ac-orange)"><div class="name">Laranja</div><div class="hex">#F08055</div></div>
    <div class="swatch dark"  style="background:var(--ac-forest)"><div class="name">Verde Floresta</div><div class="hex">#385725</div></div>
    <div class="swatch dark"  style="background:var(--ac-navy)"><div class="name">Navy (texto)</div><div class="hex">#0E2A3D</div></div>
  </div>
</body>
</html>
