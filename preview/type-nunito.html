<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: #fff; font-family: var(--ac-font-body); color: var(--ac-fg); }
  .row { display: flex; align-items: baseline; gap: 14px; padding: 6px 0; border-bottom: 1px dashed var(--ac-border); }
  .row:last-child { border: 0; }
  .lbl { font-family: var(--ac-font-mono); font-size: 11px; color: var(--ac-fg-soft); width: 110px; flex-shrink: 0; }
  .sample { white-space: nowrap; }
</style>
</head>
<body>
  <div class="row"><div class="lbl">Black 900 · 28</div><div class="sample" style="font-weight:900;font-size:28px;">A gente caminha junto.</div></div>
  <div class="row"><div class="lbl">Bold 700 · 22</div><div class="sample" style="font-weight:700;font-size:22px;">Vamos brincar de aprender</div></div>
  <div class="row"><div class="lbl">SemiBold 600 · 18</div><div class="sample" style="font-weight:600;font-size:18px;">Cada conquista importa.</div></div>
  <div class="row"><div class="lbl">Regular 400 · 16</div><div class="sample" style="font-weight:400;font-size:16px;">Conteúdo lúdico para crianças felizes.</div></div>
  <div class="row"><div class="lbl">Light 300 · 14</div><div class="sample" style="font-weight:300;font-size:14px;">Pra cada faixa etária, um jeitinho de aprender.</div></div>
</body>
</html>
