<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: #fff; font-family: var(--ac-font-body); color: var(--ac-fg); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 22px; align-items: center; }
  .ok, .no { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.4; }
  .ok { background: var(--ac-green-100); color: #33691E; border-left: 4px solid var(--ac-green-700); }
  .no { background: #FFE0E0; color: var(--ac-red-700); border-left: 4px solid var(--ac-red); }
  .ok b, .no b { display: block; font-weight: 900; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 2px; }
</style>
</head>
<body>
  <div class="grid">
    <div class="ok"><div><b>Diga</b>"Vamos brincar de aprender!"</div></div>
    <div class="no"><div><b>Não diga</b>"Conteúdo educacional formal"</div></div>
    <div class="ok"><div><b>Diga</b>"Cada conquista importa."</div></div>
    <div class="no"><div><b>Não diga</b>"Resultados garantidos"</div></div>
    <div class="ok"><div><b>Diga</b>"A gente caminha junto com você."</div></div>
    <div class="no"><div><b>Não diga</b>"Adquira nosso pacote"</div></div>
  </div>
</body>
</html>
