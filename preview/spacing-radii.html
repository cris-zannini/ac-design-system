<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../fonts.css">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: #fff; font-family: var(--ac-font-body); color: var(--ac-fg); }
  .row { display: flex; gap: 14px; align-items: flex-end; justify-content: space-between; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; flex: 1; }
  .box { width: 72px; height: 72px; background: var(--ac-blue); }
  .pill { width: 100px; height: 46px; background: var(--ac-blue); border-radius: var(--ac-radius-pill); }
  .label { font-family: var(--ac-font-mono); font-size: 11px; color: var(--ac-fg-muted); text-align: center; }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:var(--ac-radius-sm)"></div><div class="label">sm · 8<br>input</div></div>
    <div class="item"><div class="box" style="border-radius:var(--ac-radius-md)"></div><div class="label">md · 12<br>alerta</div></div>
    <div class="item"><div class="box" style="border-radius:var(--ac-radius-lg)"></div><div class="label">lg · 16<br>card</div></div>
    <div class="item"><div class="box" style="border-radius:var(--ac-radius-xl)"></div><div class="label">xl · 24<br>card grande</div></div>
    <div class="item"><div class="box" style="border-radius:var(--ac-radius-2xl)"></div><div class="label">2xl · 32<br>hero</div></div>
    <div class="item"><div class="pill"></div><div class="label">pill · 999<br>botão, badge</div></div>
  </div>
</body>
</html>
