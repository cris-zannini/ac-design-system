<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  body { margin: 0; padding: 24px; background: #fff; font-family: var(--ac-font-body); display: flex; gap: 18px; flex-wrap: wrap; align-items: center; }
  .icn { display: flex; flex-direction: column; align-items: center; gap: 6px; font-family: var(--ac-font-mono); font-size: 10px; color: var(--ac-fg-muted); }
  .icn i { color: var(--ac-blue); }
</style>
</head>
<body>
  <div class="icn"><i data-lucide="book-open"   style="width:32px;height:32px;" stroke-width="2.25"></i>book-open</div>
  <div class="icn"><i data-lucide="globe"       style="width:32px;height:32px;" stroke-width="2.25"></i>globe</div>
  <div class="icn"><i data-lucide="palette"     style="width:32px;height:32px;" stroke-width="2.25"></i>palette</div>
  <div class="icn"><i data-lucide="pencil"      style="width:32px;height:32px;" stroke-width="2.25"></i>pencil</div>
  <div class="icn"><i data-lucide="apple"       style="width:32px;height:32px;" stroke-width="2.25"></i>apple</div>
  <div class="icn"><i data-lucide="sparkles"    style="width:32px;height:32px;" stroke-width="2.25"></i>sparkles</div>
  <div class="icn"><i data-lucide="heart"       style="width:32px;height:32px;" stroke-width="2.25"></i>heart</div>
  <div class="icn"><i data-lucide="shopping-bag" style="width:32px;height:32px;" stroke-width="2.25"></i>shopping-bag</div>
  <div class="icn"><i data-lucide="play"        style="width:32px;height:32px;" stroke-width="2.25"></i>play</div>
  <div class="icn"><i data-lucide="star"        style="width:32px;height:32px;" stroke-width="2.25"></i>star</div>
  <script>lucide.createIcons();</script>
</body>
</html>
