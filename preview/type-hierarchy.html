<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px; background: #fff; font-family: var(--ac-font-body); color: var(--ac-fg); }
  .h1 { font-family: var(--ac-font-body); font-weight: 900; font-size: 56px; line-height: 1; color: var(--ac-blue); margin-top: 4px; }
  .h2 { font-family: var(--ac-font-display); font-size: 36px; color: var(--ac-blue); text-transform: uppercase; margin-top: 6px; }
  .h3 { font-weight: 900; font-size: 24px; color: var(--ac-blue); margin-top: 4px; }
  .lead { font-weight: 600; font-size: 18px; color: var(--ac-fg-muted); margin-top: 6px; }
  .body { font-size: 15px; line-height: 1.55; margin-top: 4px; max-width: 540px; }
  .eyebrow { font-weight: 900; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ac-blue-light); }
</style>
</head>
<body>
  <div class="eyebrow">Para famílias e educadores</div>
  <div class="h1">Aprender é brincar</div>
  <div class="h3">Apostilas pensadas para cada idade.</div>
  <div class="body">A gente cria material que respeita o ritmo da criança — com cor, traço e carinho.</div>
</body>
</html>
